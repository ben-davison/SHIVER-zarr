version: 2

conda:
  environment: environment.yml

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      # Force pip to install jupyter-book into the active RTD environment
      - python -m pip install "jupyter-book<1.0"
    pre_build:
      # Now generate the Sphinx configuration
      - jupyter-book config sphinx docs/

sphinx:
  configuration: docs/conf.py
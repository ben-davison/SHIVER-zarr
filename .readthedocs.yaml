version: 2

conda:
  environment: environment.yml

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      # Generate the standard Sphinx configuration from your Jupyter Book config
      - jupyter-book config sphinx .

# Tell Read The Docs to build using the dynamically generated Sphinx config
sphinx:
  builder: html
  configuration: conf.py
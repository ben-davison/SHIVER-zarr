version: 2

conda:
  environment: environment.yml

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    pre_build:
      # Tell Jupyter Book to read _config.yml from the docs/ folder
      - jupyter-book config sphinx docs/

sphinx:
  # Tell Sphinx to use the conf.py that was generated inside docs/
  configuration: docs/conf.py